<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Vault</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2.5 4 5.6v6c0 4.6 3.2 8.6 8 9.9 4.8-1.3 8-5.3 8-9.9v-6L12 2.5Z' fill='%232a78d6'/><circle cx='12' cy='11.5' r='3.4' fill='none' stroke='white' stroke-width='1.6'/></svg>">
</head>
<body>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menu-btn" aria-label="Menu"></button>
      <div class="searchwrap">
        <input type="search" id="global-search" placeholder="Search cards, players, sets, etc..." autocomplete="off">
      </div>
      <div class="savestate" id="savestate" title="Where your collection is written">
        <span class="savedot"></span><span class="savetext">loading</span>
      </div>
      <button class="account" id="account">
        <span class="avatar" id="avatar">CV</span>
        <span>My Account</span>
      </button>
    </header>

    <main class="page" id="view"></main>
  </div>
</div>

<dialog id="editor" class="editor">
  <form method="dialog" class="editor-form" id="editor-form"></form>
</dialog>

<div class="toast" id="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
