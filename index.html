<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shoebox</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#9918;</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">&#9918;</span>
    <span class="brand-name">Shoebox</span>
  </div>

  <div class="topstats" id="topstats"></div>

  <div class="savestate" id="savestate" title="Where your collection is written">
    <span class="dot"></span><span class="savetext">loading</span>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab is-on" data-view="collection">Collection</button>
  <button class="tab" data-view="checklists">Checklists</button>
  <button class="tab" data-view="value">Value</button>
  <button class="tab" data-view="data">Data</button>
</nav>

<main id="view" class="view"></main>

<dialog id="editor" class="editor">
  <form method="dialog" class="editor-form" id="editor-form"></form>
</dialog>

<div class="toast" id="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
